packages:
  - "."
# Supply-chain guard: ignore package versions published less than 3 days ago.
minimumReleaseAge: 4320
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
