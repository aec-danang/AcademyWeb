name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch breakage from the outside world (new advisories, dead site).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Compile-only build: no database or secrets needed in CI.
      - run: pnpm build:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  smoke:
    # Hits the live site. Set the SMOKE_BASE_URL repository variable to enable.
    if: vars.SMOKE_BASE_URL != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/smoke.mjs
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
